[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helixdb"
version = "1.0.0"
description = "A research and learning companion for students and researchers: research lifecycle management, event tracking, reports, imports, OCR, scoring, and role-based access."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karun Karun", email = "saikarun085@gmail.com" }]
keywords = ["research", "education", "fastapi", "ocr", "analytics", "scoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/karun99/HelixDB"
Repository = "https://github.com/karun99/HelixDB"
Issues = "https://github.com/karun99/HelixDB/issues"

[tool.setuptools]
packages = ["backend", "backend.api", "backend.config", "backend.database", "backend.schemas", "backend.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
